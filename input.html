<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal details form</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    main {
      width: min(100%, 520px);
      padding: 36px;
      background: #fff;
      border: 1px solid #e3e8f0;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgb(23 32 51 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .intro {
      margin: 0 0 28px;
      color: #647087;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    input:focus,
    select:focus {
      border-color: #315fe8;
      outline: 3px solid rgb(49 95 232 / 15%);
    }

    input[type="file"] {
      padding: 9px;
    }

    .hint {
      margin: 7px 0 0;
      color: #647087;
      font-size: 0.82rem;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: #315fe8;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #254dcc;
    }

    button:focus-visible {
      outline: 3px solid rgb(49 95 232 / 35%);
      outline-offset: 3px;
    }

    #form-status {
      margin: 16px 0 0;
      color: #176b3a;
      font-weight: 600;
    }

    #form-status:empty {
      display: none;
    }

    @media (max-width: 480px) {
      main {
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Personal details</h1>
    <p class="intro">Fill in the form below and attach a passport-size photo.</p>

    <form id="details-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="1" max="120" required>
      </div>

      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="" selected disabled>Select an option</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="non-binary">Non-binary</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
        </select>
      </div>

      <div class="field">
        <label for="aadhaar">Aadhaar card number</label>
        <input id="aadhaar" name="aadhaar" type="text" inputmode="numeric"
          pattern="[0-9]{12}" maxlength="12" autocomplete="off"
          aria-describedby="aadhaar-hint" required>
        <p class="hint" id="aadhaar-hint">Enter the 12-digit number without spaces.</p>
      </div>

      <div class="field">
        <label for="photo">Passport-size photo</label>
        <input id="photo" name="photo" type="file" accept="image/*" required>
      </div>

      <button type="submit">Submit</button>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    document.getElementById("details-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("form-status").textContent =
        "Form submitted successfully. Your details have not been sent to a server.";
    });
  </script>
</body>
</html>
